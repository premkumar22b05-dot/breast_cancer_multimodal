name: breast_cancer_multimodal
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10
  
  # PyTorch with CUDA support
  - pytorch::pytorch::2.1.2
  - pytorch::torchvision::0.16.2
  - pytorch::torchaudio::2.1.2
  - pytorch::pytorch-cuda=11.8
  
  # Scientific computing
  - numpy=1.24.3
  - scipy=1.11.4
  - pandas=2.1.3
  - scikit-learn=1.3.2
  
  # Image processing
  - opencv=4.8.1
  - pillow=10.0.1
  
  # Visualization
  - matplotlib=3.8.2
  - seaborn=0.13.0
  
  # Development
  - jupyter=1.0.0
  - ipython=8.17.2
  - pytest=7.4.3
  
  # System utilities
  - psutil=5.9.6
  - tqdm=4.66.1
  
  - pip
  
  - pip:
    # PyTorch ecosystem
    - timm==0.9.12
    - torchvision==0.16.2
    
    # Medical imaging
    - pydicom==2.4.1
    - scikit-image==0.21.0
    
    # ML Libraries
    - xgboost==2.0.3
    - lightgbm==4.1.1
    - imbalanced-learn==0.11.0
    
    # Explainability
    - shap==0.43.0
    - captum==0.7.0
    
    # Visualization
    - plotly==5.18.0
    - tensorboard==2.15.1
    
    # Configuration
    - pyyaml==6.0.1
    - python-dotenv==1.0.0
    
    # Experiment tracking
    - wandb==0.16.1
    - optuna==3.14.0
    
    # Code quality
    - black==23.12.0
    - flake8==6.1.0
    - mypy==1.7.1
